# The bridge runner hears POST /api/bridge/pull jobs. Separate file from
# upstream's compose so upstream merges never touch it. Shares the data
# dir (job queue) by bind mount; talks to openGym over the published web
# port, so no shared Docker network is needed. Credentials live in
# bridge/.env (git-ignored by the `.env` rule); Technogym login stays in
# the Flask project's own .env. Start it with:
#   docker compose -f docker-compose.bridge.yml up -d --build
name: opengym-bridge

services:
  bridge:
    build:
      context: ./bridge
    restart: unless-stopped
    env_file: ./bridge/.env
    # The runner talks to openGym over the web port published on the host.
    # Docker Desktop (Windows/Mac) hands the container host.docker.internal for
    # free; plain Docker Engine on Linux does not, so the bridge silently lost
    # the server there and every pull failed with a connection error. Mapping
    # the host gateway in makes the name resolve on both, so this file works
    # unchanged on the Linux home server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Job queue + heartbeat + inbox, shared with the api container.
      - ./data:/data
      # This project's bridge scripts. Read-write: converters write out/.
      # out/ is git-ignored; scripts themselves are versioned.
      - ./bridge:/bridge
      # Frontend parser autopush.mjs merges with (same files the app ships).
      - ./frontend/src/lib:/frontend/src/lib:ro
      # The Flask project (import scripts, export data, Technogym login).
      # Read-write: import_data.py writes its log and the Flask database.
      # Set FLASK_DIR_HOST to its location; default is the sibling folder.
      - "${FLASK_DIR_HOST:-../Personal Fitness Tracker}:/flask"
